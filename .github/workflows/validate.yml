name: Validate templates

# Pull requests and main: the library's rules (tools/library.py check), then
# every template on a real Home Assistant inside a WashData checkout. The daily
# run catches a WashData change that breaks a template already in the library.
# The WashData branch is picked from the templates themselves: main once its
# release is new enough, before that the release branch (tools/library.py
# washdata-ref), so nothing needs setting by hand.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install pyyaml==6.0.2 pytest==8.3.5
      - name: Check every template
        run: python tools/library.py check
      - name: Test the generator
        run: python -m pytest tests/test_library.py -q -p no:cacheprovider
      - name: Preview the library tiles
        if: always()
        run: |
          echo "## What WashData's library will show" >> "$GITHUB_STEP_SUMMARY"
          python tools/library.py summary >> "$GITHUB_STEP_SUMMARY"

  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: templates
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Pick the WashData branch
        id: washdata
        run: |
          pip install pyyaml==6.0.2
          ref=$(python templates/tools/library.py washdata-ref)
          echo "Validating against ha_washdata $ref" >> "$GITHUB_STEP_SUMMARY"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: 3dg1luk43/ha_washdata
          ref: ${{ steps.washdata.outputs.ref }}
          path: ha_washdata
          persist-credentials: false
      - name: Install WashData's test environment
        run: pip install -r ha_washdata/requirements-dev.txt
      - name: Validate every template on Home Assistant
        working-directory: ha_washdata
        env:
          WASHDATA_TEMPLATES: ${{ github.workspace }}/templates
        run: |
          cp "$WASHDATA_TEMPLATES/tests/test_templates.py" tests/test_washdata_templates.py
          python -m pytest tests/test_washdata_templates.py -q -p no:cacheprovider
