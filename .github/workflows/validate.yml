name: Validate templates

# Every template is checked inside a WashData checkout, with its test fixtures
# and Home Assistant's real schemas. The daily run catches a WashData change
# that breaks a template already in the library.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # The WashData branch to validate against; a repository variable can point
      # it at a release branch before that release reaches main.
      WASHDATA_REF: ${{ vars.WASHDATA_REF || 'main' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: templates
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: 3dg1luk43/ha_washdata
          ref: ${{ env.WASHDATA_REF }}
          path: ha_washdata
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ha_washdata/requirements-dev.txt
      - name: Install WashData's test environment
        run: pip install -r ha_washdata/requirements-dev.txt
      - name: Validate every template
        working-directory: ha_washdata
        env:
          WASHDATA_TEMPLATES: ${{ github.workspace }}/templates
        run: |
          cp "$WASHDATA_TEMPLATES/tests/test_templates.py" tests/test_washdata_templates.py
          python -m pytest tests/test_washdata_templates.py -q -p no:cacheprovider
